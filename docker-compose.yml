version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
      - mindsdb
    ports:
      - '${APP_PORT:-8080}:8080'
    command: ['bun', 'run', 'dist/index.js']
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mindsdb:
    image: mindsdb/mindsdb:latest
    environment:
      - MINDSDB_APIS=http,mysql
    ports:
      - '47334:47334'
      - '47335:47335'
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
